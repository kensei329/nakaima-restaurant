<style>
:root{
  --ai:#16324F;        /* 藍 */
  --ai-deep:#0D1E33;   /* 濃紺 */
  --kinari:#F6F2E9;    /* 生成り */
  --washi:#FFFDF8;
  --enji:#A8382C;      /* 臙脂 */
  --take:#4E7A63;      /* 若竹 */
  --kincha:#B08829;    /* 金茶 */
  --line:rgba(22,50,79,.16);
  --shadow:0 1px 0 rgba(22,50,79,.06), 0 8px 24px -16px rgba(13,30,51,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--kinari);
  color:var(--ai-deep);
  font-family:"Zen Kaku Gothic New","Noto Sans KR","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
.wrap{max-width:680px;margin:0 auto;padding:0 18px;}

/* ── 献上柄バンド（signature） ── */
.kenjo{height:22px;width:100%;display:block;}
.kenjo--top{border-bottom:1px solid var(--line);}

header{background:var(--washi);}
.head-inner{padding:22px 0 18px;}
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--enji);font-weight:700;margin:0 0 6px;
}
h1{
  font-family:"Shippori Mincho B1",serif;font-weight:700;
  font-size:30px;line-height:1.25;margin:0 0 8px;letter-spacing:.02em;
}
h1 .sub{display:block;font-size:13px;letter-spacing:.12em;color:var(--ai);opacity:.75;font-weight:500;margin-top:6px;}
.lede{margin:0;font-size:13.5px;color:rgba(13,30,51,.72);}

/* 言語 */
.langs{display:flex;gap:6px;margin:16px 0 2px;flex-wrap:wrap;}
.lang{
  font:inherit;font-size:12.5px;font-weight:500;
  padding:6px 12px;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--ai);cursor:pointer;
}
.lang[aria-pressed="true"]{background:var(--ai);color:var(--washi);border-color:var(--ai);}

/* フィルター */
.filters{position:sticky;top:0;z-index:20;background:var(--kinari);border-bottom:1px solid var(--line);}
.chips{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;
  padding:12px 18px 10px;margin:0 auto;max-width:680px;
}
.chip{
  font:inherit;font-size:12.5px;font-weight:500;line-height:1.3;
  padding:8px 6px;border-radius:4px;border:1px solid var(--line);
  background:var(--washi);color:var(--ai);cursor:pointer;text-align:center;
}
.chip[aria-pressed="true"]{background:var(--ai);color:var(--washi);border-color:var(--ai);}
.toggles{display:flex;gap:7px;padding:0 18px 12px;max-width:680px;margin:0 auto;flex-wrap:wrap;}
.toggle{
  font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px dashed rgba(168,56,44,.5);background:transparent;color:var(--enji);
}
.toggle[aria-pressed="true"]{background:var(--enji);color:var(--washi);border-style:solid;}

/* カード */
main{padding-top:20px;}
.count{font-size:12px;letter-spacing:.08em;color:rgba(13,30,51,.5);margin:0 0 12px;}
.card{
  background:var(--washi);border:1px solid var(--line);border-radius:3px;
  padding:0 0 14px;margin-bottom:12px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ai);z-index:2;}
.card.veg::before{background:var(--take);}
.card-body{padding:14px 16px 0;}
.photo{
  display:block;width:100%;aspect-ratio:16/9;max-height:230px;object-fit:cover;object-position:center;
  background:var(--ai);border-bottom:1px solid var(--line);
}
.illus{
  width:100%;aspect-ratio:16/9;max-height:200px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,rgba(22,50,79,.05) 0 1px,transparent 1px 14px);
}
.illus svg{width:100%;height:100%;display:block;}
.card h2{
  font-family:"Shippori Mincho B1",serif;font-size:20px;font-weight:700;
  margin:0 0 2px;line-height:1.35;letter-spacing:.01em;
}
.romaji{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(13,30,51,.45);margin:0 0 8px;}
.desc{margin:0 0 10px;font-size:14px;color:rgba(13,30,51,.85);}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-bottom:10px;font-size:12.5px;}
.walk{font-weight:700;color:var(--enji);font-size:13px;letter-spacing:.01em;}
.walk .num{font-family:"Shippori Mincho B1",serif;font-size:17px;}
.star{color:var(--kincha);font-weight:700;}
.star small{color:rgba(13,30,51,.45);font-weight:400;}
.yen{color:rgba(13,30,51,.5);letter-spacing:.1em;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag{font-size:11.5px;padding:3px 8px;border-radius:2px;background:rgba(22,50,79,.07);color:var(--ai);}
.tag.warn{background:rgba(168,56,44,.1);color:var(--enji);}
.tag.good{background:rgba(78,122,99,.13);color:var(--take);}
.map{
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-size:13px;font-weight:700;color:var(--washi);background:var(--ai);
  padding:9px 16px;border-radius:3px;
}
.map:hover{background:var(--ai-deep);}

/* ベジ注記 */
.note{
  border:1px solid rgba(78,122,99,.35);background:rgba(78,122,99,.06);
  border-radius:3px;padding:14px 15px;margin:0 0 14px;font-size:13px;color:#2F4E3F;
}
.note b{display:block;font-family:"Shippori Mincho B1",serif;font-size:15px;margin-bottom:4px;}
.empty{text-align:center;padding:40px 10px;color:rgba(13,30,51,.5);font-size:14px;}

/* 宿に戻る */
.home{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--ai-deep);border-top:1px solid rgba(255,255,255,.12);
}
.home a{
  display:flex;align-items:center;justify-content:center;gap:10px;
  max-width:680px;margin:0 auto;padding:16px 18px;
  color:var(--washi);text-decoration:none;font-weight:700;font-size:14.5px;letter-spacing:.03em;
}
.home .arrow{font-family:"Shippori Mincho B1",serif;}
footer{padding:8px 0 24px;font-size:11.5px;color:rgba(13,30,51,.45);text-align:center;}
@media (prefers-reduced-motion:no-preference){
  .card{animation:rise .34s ease-out both;}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
}
:focus-visible{outline:2px solid var(--enji);outline-offset:2px;}
</style>

  const t = UI[lang];
  document.getElementById("chips").innerHTML = Object.entries(t.cats).map(([k,v])=>
    `<button class="chip" data-cat="${k}" aria-pressed="${cat===k}">${v}</button>`).join("");
  document.getElementById("toggles").innerHTML = Object.entries(t.tog).map(([k,v])=>
    `<button class="toggle" data-tog="${k}" aria-pressed="${tog[k]}">${v}</button>`).join("");
}

function renderList(){
  const t = UI[lang];
  const shops = SHOPS.filter(s =>
    (cat==="all" ? s.cat!=="veg" : s.cat===cat) &&
    (!tog.alcohol || s.alcohol) &&
    (!tog.nomeat || s.nomeat)
  ).sort((a,b)=>a.walk-b.walk);

  document.getElementById("count").textContent = t.count(shops.length);
  document.getElementById("vegNote").innerHTML = (cat==="veg")
    ? `<div class="note"><b>${t.vegTitle}</b>${t.vegBody}</div>` : "";

  document.getElementById("list").innerHTML = shops.length ? shops.map(s=>`
    <article class="card${s.cat==="veg"?" veg":""}">
      ${s.photo
        ? `<img class="photo" src="${s.photo}" alt="${s.name}" loading="lazy">`
        : `<div class="illus" style="background-color:${TINT[s.cat]}">${ILLUS[s.cat]}</div>`}
      <div class="card-body">
        <h2>${s.name}</h2>
        <p class="romaji">${s.romaji}</p>
        <p class="desc">${s.d[lang]}</p>
        <div class="meta">
          <span class="walk">${t.walk(s.walk)}</span>
          <span class="star">★ ${s.rating.toFixed(1)} <small>(${s.reviews} ${t.reviews})</small></span>
          <span class="yen">${"¥".repeat(s.yen)}</span>
        </div>
        ${s.tags.length?`<div class="tags">${s.tags.map(k=>`<span class="tag ${TAGS[k].cls||""}">${TAGS[k][lang]}</span>`).join("")}</div>`:""}
        <a class="map" href="${mapUrl(s)}" target="_blank" rel="noopener">${t.map} →</a>
      </div>
    </article>`).join("") : `<p class="empty">${t.empty}</p>`;
}

function renderAll(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("title").childNodes[0].nodeValue = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("lede").textContent = t.lede;
  document.getElementById("homeLabel").textContent = t.home;
  document.getElementById("foot").textContent = t.foot;
  renderChips(); renderList();
}

document.querySelectorAll(".lang").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.lang;
  document.querySelectorAll(".lang").forEach(x=>x.setAttribute("aria-pressed", x===b));
  renderAll();
}));

document.getElementById("chips").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  cat = b.dataset.cat; renderChips(); renderList();
});

document.getElementById("toggles").addEventListener("click",e=>{
  const b = e.target.closest(".toggle"); if(!b) return;
  tog[b.dataset.tog] = !tog[b.dataset.tog]; renderChips(); renderList();
});

renderAll();
</script>
</body>
</html>
